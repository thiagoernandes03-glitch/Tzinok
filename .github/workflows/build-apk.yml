name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "keybind-android.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q keybind-android.zip -d extracted

          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: projeto Gradle nao encontrado no ZIP."
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERRO: arquivo Gradle do aplicativo nao encontrado."
            exit 1
          fi

      - name: Preparar chave de depuracao
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verificar configuracao Firebase
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -f app/google-services.json ] && \
             [ ! -f app/src/debug/google-services.json ] && \
             [ ! -f app/src/google-services.json ]; then
            echo "ERRO: google-services.json nao encontrado."
            echo "O projeto precisa da configuracao Firebase correta."
            echo "Se o app nao usa Firebase, remova o plugin Google Services do projeto."
            exit 1
          fi

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-android
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
