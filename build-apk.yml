name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'keybind-android.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36-ext1" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          mkdir source-project
          unzip -q keybind-android.zip -d source-project
          test -f source-project/settings.gradle.kts
          test -f source-project/app/build.gradle.kts

      - name: Build debug APK
        run: gradle -p source-project --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keybind-debug-apk
          path: source-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
